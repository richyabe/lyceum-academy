<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../shared/css/base.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/js/supabase-config.js"></script>
<script src="../shared/js/utils.js"></script>
<style>
body{background:linear-gradient(135deg,#141D30 0%,#1F2A44 50%,#263252 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,162,74,.04)1px,transparent 1px),linear-gradient(90deg,rgba(200,162,74,.04)1px,transparent 1px);background-size:50px 50px;pointer-events:none}
.login-card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(200,162,74,.2);border-radius:24px;padding:3rem 2.5rem;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login-brand{text-align:center;margin-bottom:2.2rem}
.login-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--navy-deep);margin:0 auto 1rem}
.login-title{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:.2rem}
.login-sub{font-size:.82rem;color:rgba(255,255,255,.45)}
.login-label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.55);margin-bottom:.4rem;display:block}
.login-input{width:100%;padding:.8rem 1rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(200,162,74,.2);border-radius:8px;color:#fff;font-size:.9rem;outline:none;transition:all .3s;margin-bottom:1rem}
.login-input:focus{border-color:var(--gold);background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(200,162,74,.15)}
.login-input::placeholder{color:rgba(255,255,255,.3)}
.pwd-wrap{position:relative}
.pwd-toggle{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:.9rem;transition:color .3s}
.pwd-toggle:hover{color:var(--gold)}
.login-btn{width:100%;padding:1rem;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:8px;color:var(--navy-deep);font-size:.92rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:.5rem;letter-spacing:.02em}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(200,162,74,.35)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:.75rem 1rem;color:#fca5a5;font-size:.83rem;margin-top:.75rem;display:none}
.login-error.show{display:block}
.login-footer{text-align:center;margin-top:1.5rem;font-size:.76rem;color:rgba(255,255,255,.3)}
.forgot-link{color:var(--gold);cursor:pointer;text-decoration:none;font-size:.8rem;text-align:right;display:block;margin-top:-.6rem;margin-bottom:1rem}
.forgot-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <div class="login-icon"><i class="fas fa-shield-halved"></i></div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Secure Access · Powered by Supabase</div>
  </div>

  <form id="loginForm" autocomplete="off">
    <label class="login-label" for="email">Email Address</label>
    <input class="login-input" type="email" id="email" placeholder="admin@yoursite.com" required autocomplete="username"/>

    <label class="login-label" for="password">Password</label>
    <div class="pwd-wrap">
      <input class="login-input" type="password" id="password" placeholder="Your secure password" required autocomplete="current-password" style="padding-right:2.8rem"/>
      <button type="button" class="pwd-toggle" id="togglePwd" aria-label="Toggle password"><i class="fas fa-eye" id="eyeIcon"></i></button>
    </div>

    <a class="forgot-link" id="forgotLink">Forgot password?</a>

    <button class="login-btn" type="submit" id="loginBtn"><i class="fas fa-lock-open"></i> Sign In to Dashboard</button>
    <div class="login-error" id="loginError"></div>
  </form>

  <div class="login-footer">Protected by Supabase Authentication</div>
</div>

<div id="toast-container"></div>

<script>
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'index.html';
});

document.getElementById('togglePwd').addEventListener('click', () => {
  const inp = document.getElementById('password');
  const ico = document.getElementById('eyeIcon');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  ico.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('loginError');

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
  errorEl.classList.remove('show');

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    errorEl.textContent = error.message.includes('Invalid login')
      ? 'Incorrect email or password.'
      : error.message;
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock-open"></i> Sign In to Dashboard';
  } else {
    window.location.href = 'index.html';
  }
});

document.getElementById('forgotLink').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) { showToast('Enter your email address first.', 'warning'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error) showToast('Could not send reset email.', 'error');
  else showToast('Password reset email sent. Check your inbox.', 'success', 5000);
});
</script>
</body>
</html>
